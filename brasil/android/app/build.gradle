plugins { id 'com.android.application' }
def quoted = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'br.com.namma.mobilidade'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.namma.mobilidade'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0-dev'
        manifestPlaceholders = [mapsApiKey: System.getenv('GOOGLE_MAPS_API_KEY') ?: '']
        buildConfigField 'String', 'MAPS_KEY', quoted(System.getenv('GOOGLE_MAPS_API_KEY') ?: '')
        buildConfigField 'String', 'API_URL', quoted(System.getenv('MOBILITY_API_URL') ?: '')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions 'profile'
    productFlavors {
        passageiro {
            dimension 'profile'
            applicationIdSuffix '.passageiro'
            buildConfigField 'String', 'DEV_CREDENTIAL', quoted(System.getenv('YATRI_PASSENGER_DEV_KEY') ?: '')
            resValue 'string', 'app_name', 'Yatri Brasil — Passageiro'
            buildConfigField 'String', 'ROLE', '"passenger"'
        }
        motorista {
            dimension 'profile'
            applicationIdSuffix '.motorista'
            buildConfigField 'String', 'DEV_CREDENTIAL', quoted(System.getenv('YATRI_DRIVER_DEV_KEY') ?: '')
            resValue 'string', 'app_name', 'Yatri Brasil — Motorista'
            buildConfigField 'String', 'ROLE', '"driver"'
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/originalAssets'))
    sourceSets.main.assets.srcDir(rootProject.file('attribution'))
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Reuse original font binaries; do not replace the original typography with a system font.
def originalFonts = rootProject.file('../../Frontend/android-native/app/src/main/assets/fonts')
tasks.register('recoverOriginalTypography', Sync) {
    from(originalFonts) {
        include 'PlusJakartaSans-Regular.ttf', 'PlusJakartaSans-SemiBold.ttf'
    }
    into layout.buildDirectory.dir('generated/originalAssets/fonts')
    doFirst {
        ['PlusJakartaSans-Regular.ttf', 'PlusJakartaSans-SemiBold.ttf'].each { name ->
            if (!new File(originalFonts, name).isFile()) throw new GradleException('Fonte original ausente: ' + name + '. Recupere Frontend/android-native do checkout completo.')
        }
    }
}
// Recuperar o recurso gráfico usado no whereToButtonConfig original, sem redesenhá-lo.
def originalPassengerDrawables = rootProject.file('../../Frontend/android-native/app/src/user/nammaYatri/res/drawable')
tasks.register('recoverOriginalPassengerUi', Copy) {
    from(originalPassengerDrawables) { include 'ny_ic_bent_right_arrow.png' }
    into layout.buildDirectory.dir('generated/originalAssets/original-ui')
    doFirst {
        if (!new File(originalPassengerDrawables, 'ny_ic_bent_right_arrow.png').isFile()) {
            throw new GradleException('Ícone original de destino ausente no frontend recuperado')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'recoverOriginalTypography', 'recoverOriginalPassengerUi' }
