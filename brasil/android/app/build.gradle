plugins { id 'com.android.application' }
def quoted = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'br.com.namma.mobilidade'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.namma.mobilidade'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0-dev'
        manifestPlaceholders = [mapsApiKey: System.getenv('GOOGLE_MAPS_API_KEY') ?: '']
        buildConfigField 'String', 'MAPS_KEY', quoted(System.getenv('GOOGLE_MAPS_API_KEY') ?: '')
        buildConfigField 'String', 'API_URL', quoted(System.getenv('MOBILITY_API_URL') ?: '')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions 'profile'
    productFlavors {
        passageiro {
            dimension 'profile'
            applicationIdSuffix '.passageiro'
            buildConfigField 'String', 'DEV_CREDENTIAL', quoted(System.getenv('YATRI_PASSENGER_DEV_KEY') ?: '')
            resValue 'string', 'app_name', 'Yatri Brasil — Passageiro'
            buildConfigField 'String', 'ROLE', '"passenger"'
        }
        motorista {
            dimension 'profile'
            applicationIdSuffix '.motorista'
            buildConfigField 'String', 'DEV_CREDENTIAL', quoted(System.getenv('YATRI_DRIVER_DEV_KEY') ?: '')
            resValue 'string', 'app_name', 'Yatri Brasil — Motorista'
            buildConfigField 'String', 'ROLE', '"driver"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
