services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mobilidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: mobilidade
    volumes:
      - mobility-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mobilidade -d mobilidade']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mobilidade:${POSTGRES_PASSWORD}@db:5432/mobilidade
      YATRI_DEVELOPMENT_MODE: 'true'
      YATRI_PASSENGER_DEV_KEY: ${YATRI_PASSENGER_DEV_KEY:?Configure a credencial do passageiro}
      YATRI_DRIVER_DEV_KEY: ${YATRI_DRIVER_DEV_KEY:?Configure a credencial do motorista}
      YATRI_DRIVER_PLATE: ${YATRI_DRIVER_PLATE:?Configure a placa do veículo de testes}
      YATRI_DRIVER_MODEL: ${YATRI_DRIVER_MODEL:?Configure o modelo do veículo de testes}
      YATRI_DRIVER_COLOR: ${YATRI_DRIVER_COLOR:?Configure a cor do veículo de testes}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      BASE_FARE_CENTS: ${BASE_FARE_CENTS:-500}
      PER_KM_CENTS: ${PER_KM_CENTS:-200}
      DRIVER_RADIUS_METERS: ${DRIVER_RADIUS_METERS:-5000}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mobility-data:
