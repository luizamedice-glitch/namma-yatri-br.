name: Alce - Reavaliar falha visual após aceite

on:
  workflow_dispatch:
  # Permite a primeira execução sem alterar a branch padrão main.
  push:
    branches: [codex/alce-post-accept]
    paths: ['.github/workflows/alce-address-diagnostics.yml']

permissions:
  contents: read

concurrency:
  group: lightsail-ssh-test
  cancel-in-progress: false

jobs:
  connection:
    if: github.ref == 'refs/heads/codex/alce-post-accept'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Habilitar seleção de destino e validar ciclo HTTPS
        shell: bash
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          # Identificadores públicos já confirmados pelo proprietário.
          AWS_HOST: ${{ secrets.AWS_HOST || '52.67.246.31' }}
          AWS_USER: ${{ secrets.AWS_USER || 'ubuntu' }}
          # Opcional: linha known_hosts conferida pelo proprietário fora desta conexão.
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          for name in AWS_SSH_KEY AWS_HOST AWS_USER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret obrigatória ausente: $name"
              exit 1
            fi
          done
          if [[ ! "$AWS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] ||
             [[ ! "$AWS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]; then
            echo '::error::Formato de AWS_HOST ou AWS_USER inválido.'
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/yatri-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Copiar no celular pode adicionar texto do terminal e mudar as quebras.
          # Normaliza apenas a formatação; não tenta adivinhar caracteres da chave.
          python3 - "$ssh_dir/key" <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          text = os.environ['AWS_SSH_KEY'].replace('\\r\\n', '\n').replace('\\n', '\n')
          pattern = r'-----BEGIN ((?:OPENSSH|RSA|EC) PRIVATE KEY)-----([\s\S]*?)-----END \1-----'
          blocks = list(re.finditer(pattern, text))
          if len(blocks) != 1:
              sys.exit('::error::Cole exatamente um bloco de chave privada, incluindo BEGIN e END, no secret AWS_SSH_KEY.')
          label, body = blocks[0].groups()
          body = re.sub(r'\s+', '', body)
          try:
              decoded = base64.b64decode(body, validate=True)
          except Exception:
              sys.exit('::error::O bloco da chave contém caracteres inválidos ou está incompleto. Copie novamente o arquivo original.')
          if not decoded:
              sys.exit('::error::O bloco da chave está vazio.')
          lines = '\n'.join(body[i:i+70] for i in range(0, len(body), 70))
          Path(sys.argv[1]).write_text(f'-----BEGIN {label}-----\n{lines}\n-----END {label}-----\n')
          PY
          unset AWS_SSH_KEY
          chmod 600 "$ssh_dir/key"
          # Recusa chaves inválidas ou com senha, sem imprimir conteúdo nem pedir entrada.
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null 2>&1; then
            echo '::error::AWS_SSH_KEY deve conter uma chave privada SSH válida sem senha.'
            exit 1
          fi
          host_check=accept-new
          if [[ -n "$AWS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
            host_check=yes
          else
            echo '::notice::Primeira conexão: identidade do host aceita por TOFU. Configure AWS_SSH_KNOWN_HOSTS para verificação prévia.'
            touch "$ssh_dir/known_hosts"
          fi
          unset AWS_SSH_KNOWN_HOSTS
          # Public transfer key only; the private key never leaves the runner.
          ssh-keygen -y -P '' -f "$ssh_dir/key"
          python3 - "$ssh_dir/key" "$ssh_dir/known_hosts" "$host_check" <<'PYCODE'
          import os,sys,subprocess,json,collections
          args=['ssh','-i',sys.argv[1],'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ConnectTimeout=15','-o','StrictHostKeyChecking='+sys.argv[3],'-o','UserKnownHostsFile='+sys.argv[2],os.environ['AWS_USER']+'@'+os.environ['AWS_HOST'],'sudo -n docker logs --since 30m alce-lab-compat']
          r=subprocess.run(args,capture_output=True,text=True,timeout=40)
          assert r.returncode==0
          counts=collections.Counter();offer_counts=collections.Counter()
          for line in r.stdout.splitlines():
            try:d=json.loads(line)
            except Exception:continue
            path=d.get('path','').split('?')[0]
            offer=d.get('offerState')
            if isinstance(offer,dict):offer_counts[(offer.get('available'),offer.get('online'),offer.get('count'))]+=1
            if path:counts[(d.get('method'),path,d.get('status'),json.dumps(d.get('credentialState',{}),sort_keys=True))]+=1
          print('SANITIZED_ADDRESS_COUNTS='+json.dumps([{'method':m,'path':p,'status':s,'credentialState':json.loads(c),'count':n}for(m,p,s,c),n in counts.items()]))
          print('SANITIZED_OFFER_RESPONSE_COUNTS='+json.dumps([{'available':a,'online':o,'offers':n,'responses':c}for(a,o,n),c in offer_counts.items()]))
          probe='import {connectDatabase} from \'/app/src/db.mjs\'; const db=await connectDatabase(process.env.DATABASE_URL); try { const name=await db.query(\'SELECT current_database() AS name\'); if(name.rows[0].name!==\'alce_lab\')throw Error(\'wrong_database\'); const rides=await db.query("SELECT r.status,count(*)::int AS count,max(r.created_at) AS latest,count(o.ride_id)::int AS offers FROM rides r LEFT JOIN offers o ON o.ride_id=r.id GROUP BY r.status"); const drivers=await db.query("SELECT available,lat IS NOT NULL AND lng IS NOT NULL AS gps_present,round(extract(epoch FROM now()-location_at))::int AS gps_age_seconds,(SELECT count(*)::int FROM rides r WHERE r.driver_id=d.user_id AND r.status IN (\'accepted\',\'arrived\',\'in_progress\')) AS busy_rides,(SELECT count(*)::int FROM offers o JOIN rides r ON r.id=o.ride_id WHERE o.driver_id=d.user_id AND NOT o.rejected AND r.status=\'searching\') AS searching_offers FROM drivers d"); const {mobilityService}=await import(\'/app/src/mobility.mjs\'); const {driverPilotId}=await import(\'/app/src/driver-pilot.mjs\'); const snapshot=await mobilityService(db,{}, {allowDevelopmentAccounts:true}).snapshot({id:driverPilotId,role:\'driver\'}); console.log(JSON.stringify({rideStatusCounts:rides.rows,drivers:drivers.rows,snapshot:{available:snapshot.available,online:snapshot.online,offers:snapshot.offers.length,rides:snapshot.rides.length}})); } finally {await db.end();}'
          import shlex
          args[-1]="sudo -n docker exec alce-lab-compat node --input-type=module -e "+shlex.quote(probe)
          r=subprocess.run(args,capture_output=True,text=True,timeout=40)
          assert r.returncode==0,'database read failed'
          print(r.stdout)
          PYCODE
