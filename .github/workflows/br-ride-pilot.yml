name: BR - Chamada passageiro motorista
on:
  workflow_call:
    inputs:
      apk_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  compile:
    if: ${{ !inputs.apk_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [passageiro, motorista]
    env:
      APP: ${{ matrix.app }}
      DIR: ${{ matrix.app == 'passageiro' && 'ui-customer' || 'ui-driver' }}
      GHCRTS: '-N1 -M512m'
      NODE_OPTIONS: '--openssl-legacy-provider --max-old-space-size=6144'
      YATRI_DRIVER_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
      - run: npm install --global purescript@0.15.14 spago@0.21.0
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            Frontend/${{ env.DIR }}/.spago
            Frontend/${{ env.DIR }}/output
            ~/.cache/dhall
          key: ride-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('Frontend/packages.dhall', 'Frontend/**/spago.dhall') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ride-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('Frontend/packages.dhall', 'Frontend/**/spago.dhall') }}-
            ${{ matrix.app == 'passageiro' && format('purs-0.15.14-v2-{0}-passageiro-{1}-40062877489-', runner.os, hashFiles('Frontend/packages.dhall', 'Frontend/**/spago.dhall')) || format('purs-driver-original-v1-{0}-{1}-', runner.os, hashFiles('Frontend/packages.dhall', 'Frontend/ui-driver/spago.dhall')) }}
      - name: Exigir cache quente
        env:
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          test -n "$MATCHED"
          test -s "Frontend/$DIR/output/Screens.HomeScreen.View/index.js"
      - working-directory: Frontend/${{ env.DIR }}
        run: |
          npm install --legacy-peer-deps
          spago -j 2 install
      - name: Compilar somente a dependencia transitiva da entrada original
        run: |
          if [[ "$APP" == motorista ]]; then TARGET=Development.Driver; else TARGET=Main; fi
          python3 Frontend/scripts/diagnose-purescript.py --app "$APP" --compiler-version 0.15.14 --mode staged --target-module "$TARGET" --batch-size 25 --heap 10g --timeout-seconds 600 --stall-seconds 300 --rss-limit-mib 12288 --label ride
      - working-directory: Frontend/${{ env.DIR }}
        run: |
          npm run bundle:android
          node --check dist/android/index_bundle.js
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outcome == 'success'
        with:
          path: |
            Frontend/${{ env.DIR }}/.spago
            Frontend/${{ env.DIR }}/output
            ~/.cache/dhall
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-${{ matrix.app }}-diagnostico
          path: purescript-diagnostics/
      - uses: actions/upload-artifact@v4
        with:
          name: ride-${{ matrix.app }}-bundle
          path: Frontend/${{ env.DIR }}/dist/android/
          if-no-files-found: error
  android:
    needs: compile
    if: ${{ !inputs.apk_run_id && needs.compile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ride-passageiro-bundle
          path: Frontend/ui-customer/dist/android
      - uses: actions/download-artifact@v4
        with:
          name: ride-motorista-bundle
          path: Frontend/ui-driver/dist/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - working-directory: Frontend
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.Google_Maps_API_Key }}
          YATRI_BACKEND_URL: https://52-67-246-31.sslip.io
          YATRI_MAPS_TEST_MODE: 'true'
        run: |
          cp ui-customer/dist/android/index_bundle.js android-native/app/src/user/nammaYatri/assets/juspay/index_bundle.js
          cp ui-driver/dist/android/index_bundle.js android-native/app/src/driver/nammaYatriPartner/assets/juspay/index_bundle.js
          bash userJuspayAssets.sh nammaYatri
          bash driverJuspayAssets.sh nammaYatriPartner
          cp android-native/local-temp.properties android-native/local.properties
          cd android-native
          bash gradlew :app:assembleNyUserProdDebug :app:assembleNyDriverProdDebug -PbrTestMode=true -PbrRidePilot=true --no-daemon --max-workers=2 --stacktrace
      - name: Conferir os dois bundles nos APKs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil,json
          out=Path('ride-apks');out.mkdir()
          for role,variant,app in [('passageiro','nyUserProd','ui-customer'),('motorista','nyDriverProd','ui-driver')]:
            files=list(Path('Frontend/android-native/app/build/outputs/apk',variant,'debug').glob('*.apk'))
            assert len(files)==1
            with ZipFile(files[0]) as apk:
              assert apk.read('assets/juspay/index_bundle.js')==Path('Frontend',app,'dist/android/index_bundle.js').read_bytes()
              if role=='passageiro':
                config=json.loads(apk.read('assets/juspay/yatri_places_config.json'))
                assert config['mapsTestMode'] and not config.get('passengerCredential')
            shutil.copy(files[0],out/('alce-yatri-'+role+'-teste.apk'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ride-passageiro-apk
          path: ride-apks/alce-yatri-passageiro-teste.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ride-motorista-apk
          path: ride-apks/alce-yatri-motorista-teste.apk
          if-no-files-found: error
