name: BR - Recuperacao e backups PostgreSQL
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, install, backup, status]
        default: validate
        description: 'Instalar timers reversiveis, verificar backup isolado ou consultar saude'
  push:
    branches: [codex/issue-1-purescript-memory]
    paths: ['.github/workflows/br-database-operations.yml']
permissions:
  contents: read
concurrency:
  group: lightsail-ssh-test
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yatri_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: recovery_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U yatri_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yatri_test:fixture-only@127.0.0.1:5432/recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix brasil/backend
      - run: npm test --prefix brasil/backend
      - run: npm run test:integration --prefix brasil/backend
      - run: node --test brasil/backend/test/db-errors.test.mjs brasil/backend/test/backup-crypto.test.mjs brasil/backend/test/db-outage.test.mjs
      - run: python3 -m py_compile brasil/backend/ops/maintenance.py brasil/backend/ops/install-maintenance.py brasil/backend/ops/verify-backup.py
      - run: bash -n brasil/backend/ops/maintenance-ssh.sh
      - run: python3 brasil/backend/test/maintenance.test.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: database-resilience-evidence
          path: db-resilience-evidence.json
          retention-days: 7
  operations:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Operacao sem restaurar ou parar o banco ativo
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
          YATRI_MAINTENANCE_OPERATION: ${{ inputs.operation }}
        run: bash brasil/backend/ops/maintenance-ssh.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-backup-and-health
          path: ${{ runner.temp }}/maintenance-artifacts/
          retention-days: 7
