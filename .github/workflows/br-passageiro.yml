name: BR - APK Passageiro
on:
  push:
    branches: [passageiro-pt-br]
    paths: ['brasil/android/**', 'Frontend/android-native/app/src/main/assets/fonts/**', '.github/workflows/br-passageiro.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brasil/android
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MOBILITY_API_URL: ${{ vars.MOBILITY_API_URL }}
      YATRI_PASSENGER_DEV_KEY: ${{ secrets.YATRI_PASSENGER_DEV_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate development APK configuration
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.MOBILITY_API_URL || '';
          if (!/^https:\/\/[^\s]+$/.test(url)) throw new Error('Configure MOBILITY_API_URL com o backend de desenvolvimento HTTPS acessível aos celulares');
          if (!/^[a-f0-9]{64}$/.test(process.env.YATRI_PASSENGER_DEV_KEY || '')) throw new Error('Configure a credencial separada deste perfil no secret YATRI_PASSENGER_DEV_KEY');
          NODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assemblePassageiroDebug :app:lintPassageiroDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: passageiro-debug-apk
          path: brasil/android/app/build/outputs/apk/passageiro/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passageiro-lint
          path: brasil/android/app/build/reports/lint-results-*
