name: BR - Compilar PureScript original

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purescript:
    name: PureScript - ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - nome: passageiro
            diretorio: ui-customer
          - nome: motorista
            diretorio: ui-driver
    steps:
      - uses: actions/checkout@v4
        with:
          ref: passageiro-pt-br
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Preparar instalacao legada
        run: |
          npm config set ignore-scripts false
          node --version
          free -h
      - name: Instalar compilador e Spago historicos
        run: |
          npm install --global --ignore-scripts=false purescript@0.15.4 spago@0.21.0
          command -v purs
          purs --version
          command -v spago
          spago --version
      - name: Instalar dependencias e compilador
        working-directory: Frontend/${{ matrix.diretorio }}
        run: |
          set -o pipefail
          npm install --legacy-peer-deps --ignore-scripts=false 2>&1 | tee "$GITHUB_WORKSPACE/npm-install.log"
          purs --version
          spago --version
      - name: Compilar frontend original
        working-directory: Frontend/${{ matrix.diretorio }}
        env:
          GHCRTS: '-N1 -M10g'
        run: |
          set -o pipefail
          echo 'Memoria disponivel antes da compilacao:'
          free -h
          echo 'Limite de memoria do runner:'
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          spago build 2>&1 | tee "$GITHUB_WORKSPACE/purescript-build.log"
      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure-original-${{ matrix.nome }}
          path: |
            npm-install.log
            purescript-build.log
          if-no-files-found: warn
