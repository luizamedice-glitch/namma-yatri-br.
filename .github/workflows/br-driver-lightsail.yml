name: BR - Motorista no Lightsail
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightsail-ssh-test
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yatri_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: driver_pilot
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U yatri_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yatri_test:fixture-only@127.0.0.1:5432/driver_pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix brasil/backend
      - run: npm test --prefix brasil/backend
      - run: npm run test:integration --prefix brasil/backend
      - run: node --test brasil/backend/test/driver-pilot.test.mjs Frontend/scripts/test-driver-operations.mjs Frontend/scripts/test-driver-backend.integration.mjs
      - run: python3 brasil/backend/test/driver-pilot-ops.test.py
  deploy:
    needs: contracts
    if: github.ref == 'refs/heads/codex/issue-1-purescript-memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar piloto restrito sem recriar servicos existentes
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/yatri-driver.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$AWS_SSH_KEY" > "$work/key"
          unset AWS_SSH_KEY
          touch "$work/known_hosts"
          host_check=accept-new
          if [[ -n "$AWS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > "$work/known_hosts"
            host_check=yes
          fi
          args=(-i "$work/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=15 -o "StrictHostKeyChecking=$host_check" -o "UserKnownHostsFile=$work/known_hosts")
          target=ubuntu@52.67.246.31
          remote_dir=$(ssh "${args[@]}" "$target" 'mktemp -d /tmp/yatri-driver.XXXXXX')
          [[ "$remote_dir" =~ ^/tmp/yatri-driver\.[a-zA-Z0-9]+$ ]]
          git archive --format=tar.gz "$GITHUB_SHA" brasil/backend > "$work/backend.tar.gz"
          scp "${args[@]}" "$work/backend.tar.gz" "$target:$remote_dir/"
          ssh "${args[@]}" "$target" "tar -xzf '$remote_dir/backend.tar.gz' -C '$remote_dir' && sudo -n python3 '$remote_dir/brasil/backend/ops/deploy-driver-pilot.py' '$remote_dir/brasil/backend' '$GITHUB_SHA'"
          ssh "${args[@]}" "$target" "rm -rf -- '$remote_dir'"
