name: BR - Motorista original sem login
on:
  push:
    branches: [codex/issue-1-purescript-memory]
    paths: ['.github/workflows/br-driver-original.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: br-driver-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
      - run: node --test Frontend/scripts/test-driver-operations.mjs
      - run: npm install --global purescript@0.15.14 spago@0.21.0
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            Frontend/ui-driver/.spago
            Frontend/ui-driver/output
            ~/.cache/dhall
          key: purs-driver-original-v1-${{ runner.os }}-${{ hashFiles('Frontend/packages.dhall', 'Frontend/ui-driver/spago.dhall') }}-${{ github.run_id }}
          restore-keys: purs-driver-original-v1-${{ runner.os }}-${{ hashFiles('Frontend/packages.dhall', 'Frontend/ui-driver/spago.dhall') }}-
      - name: Instalar dependencias historicas sem alterar manifestos
        working-directory: Frontend/ui-driver
        run: |
          npm install --legacy-peer-deps
          spago -j 2 install
      - name: Compilar apenas o painel original e suas dependencias em lotes
        env:
          GHCRTS: '-N1 -M512m'
        run: python3 Frontend/scripts/diagnose-purescript.py --app motorista --compiler-version 0.15.14 --mode staged --target-module Development.Driver --warmup-module Resource.Localizable.StringsV2OG --batch-size 25 --heap 10g --timeout-seconds 600 --stall-seconds 300 --rss-limit-mib 12288 --label driver
      - name: Empacotar entrada de teste sem o fluxo indiano
        working-directory: Frontend/ui-driver
        env:
          YATRI_DRIVER_TEST_BUILD: 'true'
          NODE_OPTIONS: '--openssl-legacy-provider --max-old-space-size=6144'
        run: |
          npm run bundle:android
          node --check dist/android/index_bundle.js
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outcome == 'success'
        with:
          path: |
            Frontend/ui-driver/.spago
            Frontend/ui-driver/output
            ~/.cache/dhall
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motorista-original-diagnostico
          path: purescript-diagnostics/
      - uses: actions/upload-artifact@v4
        with:
          name: motorista-original-bundle
          path: Frontend/ui-driver/dist/android/
  android:
    needs: original
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: motorista-original-bundle
          path: Frontend/ui-driver/dist/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Integrar bundle original e compilar APK de motorista BR
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.Google_Maps_API_Key }}
        working-directory: Frontend
        run: |
          cp ui-driver/dist/android/index_bundle.js android-native/app/src/driver/nammaYatriPartner/assets/juspay/index_bundle.js
          bash driverJuspayAssets.sh nammaYatriPartner
          cp android-native/local-temp.properties android-native/local.properties
          cd android-native
          bash gradlew :app:assembleNyDriverProdDebug -PbrTestMode=true --no-daemon --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: alce-yatri-motorista-original-apk
          path: Frontend/android-native/app/build/outputs/apk/nyDriverProd/debug/*.apk
          if-no-files-found: error

  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yatri_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: driver_contract
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U yatri_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yatri_test:fixture-only@127.0.0.1:5432/driver_contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix brasil/backend
      - run: node --test Frontend/scripts/test-driver-operations.mjs Frontend/scripts/test-driver-backend.integration.mjs
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yatri_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: driver_acceptance
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U yatri_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yatri_test:fixture-only@127.0.0.1:5432/driver_acceptance
      DRIVER_ACCEPTANCE_SESSION_FILE: ${{ github.workspace }}/../driver-session.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: alce-yatri-motorista-original-apk
          path: driver-apk
      - run: npm ci --prefix brasil/backend
      - name: Iniciar API e contas persistidas do aceite isolado
        run: |
          node Frontend/scripts/serve-driver-acceptance.mjs > "$RUNNER_TEMP/driver-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            test -s "$DRIVER_ACCEPTANCE_SESSION_FILE" && break
            sleep 1
          done
          test -s "$DRIVER_ACCEPTANCE_SESSION_FILE"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -g driver-apk/*.apk
            adb shell settings put secure location_mode 3
            python3 Frontend/scripts/test-driver-original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motorista-original-aceite-android
          path: driver-original-evidence/
          if-no-files-found: warn
