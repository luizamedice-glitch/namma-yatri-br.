name: BR - Gerar imagens Android corrigidas

on:
  push:
    branches: ['codex/issue-1-purescript-memory']
    paths:
      - '.github/workflows/br-branding-assets.yml'
      - 'Frontend/scripts/build-br-branding-assets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1-purescript-memory
          persist-credentials: true
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Gerar ícones adaptativos, splash e logotipo
        run: python Frontend/scripts/build-br-branding-assets.py
      - name: Publicar somente recursos brasileiros no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/android-native/app/src/brTest/res/drawable-nodpi/br_splash.png
          git add Frontend/android-native/app/src/brTest/res/drawable-nodpi/br_logo_transparent.png
          git add Frontend/android-native/app/src/brTest/res/mipmap-*/br_launcher_foreground.png
          git add Frontend/android-native/app/src/brTest/res/mipmap-*/ic_launcher_debug*.png
          if git diff --cached --quiet; then
            echo "Recursos já correspondem ao gerador."
          else
            git commit -m "brand: publicar imagens corrigidas no Android BR [skip ci]"
            git push origin HEAD:codex/issue-1-purescript-memory
          fi
