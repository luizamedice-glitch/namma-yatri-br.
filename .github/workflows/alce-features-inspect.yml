name: Alce - Inspecionar módulos atuais para recursos complementares

on:
  workflow_dispatch:
  # Permite a primeira execução sem alterar a branch padrão main.
  push:
    branches: [codex/alce-partner-features]
    paths: ['.github/workflows/alce-features-inspect.yml']

permissions:
  contents: read

concurrency:
  group: lightsail-ssh-test
  cancel-in-progress: false

jobs:
  connection:
    if: github.ref == 'refs/heads/codex/alce-partner-features'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recuperar somente fontes em execução, com entrega cifrada
        shell: bash
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          # Identificadores públicos já confirmados pelo proprietário.
          AWS_HOST: ${{ secrets.AWS_HOST || '52.67.246.31' }}
          AWS_USER: ${{ secrets.AWS_USER || 'ubuntu' }}
          # Opcional: linha known_hosts conferida pelo proprietário fora desta conexão.
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          set +x
          for name in AWS_SSH_KEY AWS_HOST AWS_USER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret obrigatória ausente: $name"
              exit 1
            fi
          done
          if [[ ! "$AWS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] ||
             [[ ! "$AWS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]; then
            echo '::error::Formato de AWS_HOST ou AWS_USER inválido.'
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/yatri-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Copiar no celular pode adicionar texto do terminal e mudar as quebras.
          # Normaliza apenas a formatação; não tenta adivinhar caracteres da chave.
          python3 - "$ssh_dir/key" <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          text = os.environ['AWS_SSH_KEY'].replace('\\r\\n', '\n').replace('\\n', '\n')
          pattern = r'-----BEGIN ((?:OPENSSH|RSA|EC) PRIVATE KEY)-----([\s\S]*?)-----END \1-----'
          blocks = list(re.finditer(pattern, text))
          if len(blocks) != 1:
              sys.exit('::error::Cole exatamente um bloco de chave privada, incluindo BEGIN e END, no secret AWS_SSH_KEY.')
          label, body = blocks[0].groups()
          body = re.sub(r'\s+', '', body)
          try:
              decoded = base64.b64decode(body, validate=True)
          except Exception:
              sys.exit('::error::O bloco da chave contém caracteres inválidos ou está incompleto. Copie novamente o arquivo original.')
          if not decoded:
              sys.exit('::error::O bloco da chave está vazio.')
          lines = '\n'.join(body[i:i+70] for i in range(0, len(body), 70))
          Path(sys.argv[1]).write_text(f'-----BEGIN {label}-----\n{lines}\n-----END {label}-----\n')
          PY
          unset AWS_SSH_KEY
          chmod 600 "$ssh_dir/key"
          # Recusa chaves inválidas ou com senha, sem imprimir conteúdo nem pedir entrada.
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null 2>&1; then
            echo '::error::AWS_SSH_KEY deve conter uma chave privada SSH válida sem senha.'
            exit 1
          fi
          host_check=accept-new
          if [[ -n "$AWS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
            host_check=yes
          else
            echo '::notice::Primeira conexão: identidade do host aceita por TOFU. Configure AWS_SSH_KNOWN_HOSTS para verificação prévia.'
            touch "$ssh_dir/known_hosts"
          fi
          unset AWS_SSH_KNOWN_HOSTS
          python3 -m pip install --quiet cryptography==46.0.3
          python3 - "$ssh_dir/key" "$ssh_dir/known_hosts" "$host_check" <<'PYCODE'
          import sys
          import base64,json,os,subprocess
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public=serialization.load_pem_public_key('-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqVSxnLaU1j9NUOY6eMTg\nSHmghm0x1gQvM0/BN3j/1eAlTJ+JSs0VrZ/4rwZun/UlU0+Gb9w/ZjSFdPJsF43M\nYOUUJZa2sTIVk9X8Xqt13AgTEulXJb/r5/YxerH2F/OKSY4dQqv+OojR/VGeTtBK\nJU+g68wIOqFUq3B+nJUhoaKc/9GQsHDuuJfK4sPgtHXtgcWlutePbxK3P5oWc79F\nMDLox/jnEpMEEkUsP9cLjmfxSgjo+eAUmbN6nduKFWwJHx/iotWGAYD/NK3nuRmw\nSkP3zCGN1eWnR7nGStZImlIdvKIxtYOI1BnjbkxKrQUdNzXXYZMoxKiACWCND+n6\ndvepoeWK8/F7w31CRvTN6kJR9/WX7uBIzOovAspEjVuV6QL8SQ9yOFy0dCKDqGhv\n9cBCSYnntf9cWpcRVP5cVGx8vDi0cQ/4ynvXu3YdX5BrkDy621Vit0UnScOYG5oa\nijE/6uKrKnOF2fN4AKojEx6HmXZ47zZXb3gQOCPyUuznAgMBAAE=\n-----END PUBLIC KEY-----\n'.encode())
          a=['ssh','-i',sys.argv[1],'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ConnectTimeout=15','-o','StrictHostKeyChecking='+sys.argv[3],'-o','UserKnownHostsFile='+sys.argv[2],os.environ['AWS_USER']+'@'+os.environ['AWS_HOST'],'sudo -n python3 -']
          p=subprocess.run(a,input="import json,subprocess,base64,hashlib\nfrom pathlib import Path\nv=json.loads(subprocess.check_output(['docker','inspect','alce-lab-compat']))[0]\nr=Path(next(m['Source']for m in v['Mounts']if m['Destination']=='/app/alce-compat'))\nfiles={p.name:base64.b64encode(p.read_bytes()).decode()for p in r.iterdir()if p.is_file()and p.suffix in ['.mjs','.json']}\nenv=dict(x.split('=',1)for x in v['Config']['Env']if '='in x)\nprint(json.dumps({'files':files,'image':v['Config']['Image'],'release':r.name,'moduleHashes':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()for p in r.glob('*.mjs')},'envNames':sorted(env),'pilotUntil':env.get('YATRI_DRIVER_PILOT_UNTIL'),'isolated':env.get('ALCE_ISOLATED_MODE')=='true'}))\n",text=True,capture_output=True,timeout=45)
          if p.returncode:sys.exit('Read-only runtime snapshot failed; no data printed')
          v=json.loads(p.stdout);assert v['isolated'];plain=p.stdout.encode();key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          b={'wrappedKey':public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)),'nonce':nonce,'ciphertext':AESGCM(key).encrypt(nonce,plain,b'alce-features-v1')}
          Path('runtime.sealed.json').write_text(json.dumps({k:base64.b64encode(x).decode()for k,x in b.items()}))
          print('READ_ONLY_CURRENT_MODULES_RECOVERED_ENCRYPTED')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: alce-features-runtime
          path: runtime.sealed.json
          retention-days: 1
