name: BR - APK Motorista
on:
  push:
    branches: [passageiro-pt-br]
    paths: ['brasil/android/**', '.github/workflows/br-motorista.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brasil/android
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MOBILITY_API_URL: ${{ vars.MOBILITY_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleMotoristaDebug :app:lintMotoristaDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: motorista-debug-apk
          path: brasil/android/app/build/outputs/apk/motorista/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motorista-lint
          path: brasil/android/app/build/reports/lint-results-*
