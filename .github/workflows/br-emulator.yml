name: BR - Android startup emulator
on:
  push:
    branches: [passageiro-pt-br]
    paths: ['brasil/android/**', '.github/workflows/br-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle -p brasil/android :app:connectedPassageiroDebugAndroidTest :app:connectedMotoristaDebugAndroidTest --stacktrace
            mkdir -p brasil/android/evidence
            adb shell am start -W -n br.com.namma.mobilidade.passageiro/br.com.namma.mobilidade.MainActivity
            adb shell sleep 2
            adb shell screencap -p /sdcard/passageiro.png
            adb pull /sdcard/passageiro.png brasil/android/evidence/passageiro-login.png
            adb shell am start -W -n br.com.namma.mobilidade.motorista/br.com.namma.mobilidade.MainActivity
            adb shell sleep 2
            adb shell screencap -p /sdcard/motorista.png
            adb pull /sdcard/motorista.png brasil/android/evidence/motorista-login.png
            adb logcat -d > brasil/android/evidence/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-evidence
          path: |
            brasil/android/evidence
            brasil/android/app/build/reports/androidTests
            brasil/android/app/build/outputs/androidTest-results
