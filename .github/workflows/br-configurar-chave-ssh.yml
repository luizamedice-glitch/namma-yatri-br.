name: BR - Configurar chave SSH do arquivo original

on:
  push:
    branches: [codex/issue-1-purescript-memory]
    paths:
      - '.github/workflows/br-configurar-chave-ssh.yml'
      - 'brasil/backend/ops/aws-ssh-key.sealed.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configurar-chave-ssh-yatri
  cancel-in-progress: false

jobs:
  configurar:
    if: github.ref == 'refs/heads/codex/issue-1-purescript-memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Obter chave pública de criptografia ou aplicar envelope selado
        env:
          GH_TOKEN: ${{ secrets.IMPORT_GH_PAT }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Token de automação IMPORT_GH_PAT indisponível; nenhum secret alterado.'
            exit 1
          fi
          # Esta resposta contém somente a chave PÚBLICA de criptografia do GitHub.
          gh api "repos/$GH_REPO/actions/secrets/public-key" --jq '{key_id, key}'
          envelope=brasil/backend/ops/aws-ssh-key.sealed.json
          if [[ -f "$envelope" ]]; then
            # O envelope foi cifrado localmente para a chave pública acima.
            # Somente o GitHub pode abri-lo. Nenhuma chave privada entra no Git.
            gh api --method PUT "repos/$GH_REPO/actions/secrets/AWS_SSH_KEY" --input "$envelope"
            echo 'AWS_SSH_KEY atualizada a partir do arquivo original, sem cópia manual.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Somente chave pública obtida; nenhum secret alterado.' >> "$GITHUB_STEP_SUMMARY"
          fi
